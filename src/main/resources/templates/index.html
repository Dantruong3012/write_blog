<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viết Blog Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Tạo Blog Mới</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/create-blog}" th:object="${blogDto}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Tên tác giả:</label>
                            <input type="text" class="form-control" th:field="*{userName}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Chọn ảnh minh họa:</label>
                            <input type="file" name="imageFile" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nội dung bài viết:</label>
                            <textarea class="form-control" th:field="*{content}" rows="5" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Đăng Bài</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
